services:
  localstack:
    image: localstack/localstack:4.4.0
    container_name: serverless-ingestion-engine-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sns,sqs,dynamodb
      - AWS_DEFAULT_REGION=ca-central-1
      - SQS_ENDPOINT_STRATEGY=path
      - LOCALSTACK_HOST=localstack:4566
    volumes:
      - ./scripts/01-init.sh:/etc/localstack/init/ready.d/01-init.sh:ro,z
      - ./feeds.json:/tmp/feeds.json:ro,z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: serverless-ingestion-engine:dev
    container_name: serverless-ingestion-engine-dispatcher
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ca-central-1
      - DYNAMODB_TABLE=serverless-ingestion-engine
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-https://httpbin.org/post}
      - SQS_QUEUE_NAME=serverless-ingestion-engine-queue
    command: ["python", "-m", "src.consumer"]
    restart: unless-stopped

  extractor:
    image: serverless-ingestion-engine:dev
    container_name: serverless-ingestion-engine-extractor
    depends_on:
      localstack:
        condition: service_healthy
      dispatcher:
        condition: service_started
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=ca-central-1
      - CONFIG_BUCKET=serverless-ingestion-engine-feeds
      - SNS_TOPIC_ARN=arn:aws:sns:ca-central-1:000000000000:serverless-ingestion-engine-topic
    command: ["python", "-m", "src.extractor"]
