[project]
name = "cloud-feed-pipeline"
version = "0.1.0"
description = "Serverless event-driven RSS feed extractor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.131",
    "feedparser>=6.0.11",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

