name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      infra: ${{ steps.filter.outputs.infra }}
      docker: ${{ steps.filter.outputs.docker }}
      markdown: ${{ steps.filter.outputs.markdown }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
            infra:
              - 'infra/**'
              - '.tflint.hcl'
            docker:
              - 'Dockerfile'
              - 'src/**'
              - 'pyproject.toml'
              - 'uv.lock'
            markdown:
              - '**/*.md'

  python:
    name: Python Quality & Tests
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint and Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Unit Tests
        run: uv run pytest

  markdown:
    name: Markdown Lint
    needs: changes
    if: ${{ needs.changes.outputs.markdown == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Markdown Lint
        run: make md-lint

  infra-security:
    name: Infrastructure & Policy Scanning
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.9.0

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive infra/

      - name: Validate Root and Modules
        run: |
          cd infra
          tofu init -backend=false
          tofu validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Init and Run TFLint
        run: |
          tflint --init
          tflint --chdir=infra

      - name: Scan IaC with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'infra'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  container-security:
    name: Container Build & Vulnerability Scan
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: serverless-ingestion-engine:test

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'serverless-ingestion-engine:test'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
